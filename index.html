<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas </title>
    <link rel="styleheet" href="styer.css">
    <script src="script.js.js" defer></script>
</head>
<body>
    <main class="app">
        <h1>Minhas tarefas</h1>
        
        <div class="entrada">
            <input id="tarefa" type="text" placeholder="digite uma tarefa" autocomplete="off">
            <button id="adicionar" type="button">adicionar</button>
        </div>
        <p id="mensagem" class="mensagem"></p>

        <ul id="lista" class="lista"></ul>

        <p id="contador" class="contador">Nenhuma tarefa ainda</p>
    </main>
</body>
</html>
